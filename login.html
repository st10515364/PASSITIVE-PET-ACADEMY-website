<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pawsitive Pet Academy</title>
</head>
<body>
    <header>
    <h1>Pawsitive Pet Academy</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="CreatAccount.html">Create Account</a>
    </nav>

    <hr>
</header>
<main>

    <section>

        <h2>Welcome Back</h2>
        <img src="Images\Black and White Illustrative Pet Shop Logo.png" width="400"
     height="300">

        <p>Login to continue your learning journey.</p>

        <form action="#" method="post">

            <p>
                <label for="email">Email Address</label>
                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </p>


            <p>
                <label for="password">Password</label>
                <br>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </p>


            <p>
                <a href="#">Forgot Password?</a>
            </p>


            <button type="button"
              onclick="window.location.href='dashboard.html'">
                Login  
            </button>

        </form>
       



        <p>
            Don't have an account?
            <a href="CreatAccount.html">Create Account</a>
        </p>

    </section>

</main>


<footer>
    <hr>
    <p>&copy; 2026 Pawsitive Pet Academy</p>
</footer>

</body>
</html>
