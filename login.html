<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pawsitive Pet Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <h1>Pawsitive Pet Academy</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="CreatAccount.html">Create Account</a>
    </nav>

    <hr>
</header>
<main>

    <section>

        <h2>Welcome Back</h2>
        <img src="Images/Black and White Illustrative Pet Shop Logo.png" width="400"
     height="300">

        <p>Login to continue your learning journey.</p>

        <form id="loginForm" action="#" method="post">

            <p>
                <label for="email">Email Address</label>
                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
                <span id="emailError" class="error-text">Please enter a valid email address.</span>
            </p>


            <p>
                <label for="password">Password</label>
                <br>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
                <span id="passwordError" class="error-text">Password must be at least 6 characters.</span>
            </p>


            <p>
                <a href="#">Forgot Password?</a>
            </p>


            <button type="submit">
                Login
            </button>

        </form>
       



        <p>
            Don't have an account?
            <a href="CreatAccount.html">Create Account</a>
        </p>

    </section>

</main>


<footer>
    <hr>
    <p>&copy; 2026 Pawsitive Pet Academy</p>
</footer>
<script src="script.js"></script>
</body>
</html>
