<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send an Inquiry - Pawsitive Pet Academy</title>
</head>
<body>
    <header>

    <h1>Pawsitive Pet Academy</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="qoute.html">Get a Quote</a>
    </nav>

    <hr>

</header>
<main>

    <section>

        <h2>Send an Inquiry</h2>

        <p>
            Have a question? Send us a message and
            our team will get back to you.
        </p>

    </section>


    <form action="#" method="post">

        <!-- Name -->
        <section>

            <label for="name">
                Full Name
            </label>

            <br>

            <input
                type="text"
                id="name"
                name="name"
                required
            >

        </section>


        <br>


        <!-- Email -->
        <section>

            <label for="email">
                Email Address
            </label>

            <br>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

        </section>


        <br>


        <!-- Phone -->
        <section>

            <label for="phone">
                Phone Number
            </label>

            <br>

            <input
                type="tel"
                id="phone"
                name="phone"
            >

        </section>


        <br>


        <!-- Inquiry Type -->
        <section>

            <label for="topic">
                What is your inquiry about?
            </label>

            <br>

            <select id="topic" name="topic">

                <option>
                    Course Information
                </option>

                <option>
                    Pet Training
                </option>

                <option>
                    Pricing
                </option>

                <option>
                    General Question
                </option>

            </select>

        </section>


        <br>


        <!-- Message -->
        <section>

            <label for="message">
                Send a Message
            </label>

            <br>

            <textarea
                id="message"
                name="message"
                rows="8"
                cols="45"
            ></textarea>

        </section>


        <br>


        <button type="submit">
            Send Inquiry
        </button>

    </form>

</main>


<footer>

    <hr>

    <p>
        &copy; 2026 Pawsitive Pet Academy
    </p>

</footer>
</body>
</html>
