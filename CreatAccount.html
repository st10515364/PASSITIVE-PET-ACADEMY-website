<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Pawsitive Pet Academy</title>
</head>
<body>
    <header>
    <h1>Pawsitive Pet Academy</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>

    <hr>
</header>
<main>

    <section>

        <h2>Create Account</h2>

        <p>Join Pawsitive Pet Academy today.</p>


        <form action="#" method="post">

            <p>
                <label for="fullname">
                    Full Name
                </label>

                <br>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    required
                >
            </p>


            <p>
                <label for="email">
                    Email Address
                </label>

                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </p>


            <p>
                <label for="phone">
                    Phone Number
                </label>

                <br>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                >
            </p>


            <p>
                <label for="password">
                    Password
                </label>

                <br>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </p>


            <p>
                <label for="confirmPassword">
                    Confirm Password
                </label>

                <br>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    required
                >
            </p>


            <button type="submit">
                Create Account
            </button>

        </form>


        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </section>

</main>


<footer>
    <hr>
    <p>&copy; 2026 Pawsitive Pet Academy</p>
</footer>
</body>
</html>
